[package]
name = "mdreader"
version = "0.3.1"
description = "支持实时渲染、Mermaid 图表与主题切换的 Markdown 桌面工具"
authors = ["Aides"]
edition = "2021"

[lib]
name = "mdreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
