appId: com.qiuyj.mdreader
productName: MdReader
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  fileAssociations:
    - ext:
        - md
        - markdown
        - mdown
        - mkd
      name: Markdown 文档
      description: Markdown 文档
      role: Editor
      icon: build/md-file.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MdReader
