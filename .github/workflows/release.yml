name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: node scripts/copy-vditor.mjs
      # 版本号单一来源：以 package.json 为准同步 tauri.conf.json 与 Cargo.toml，
      # 避免只改 package.json 打 tag 导致产物版本漂移（npm ci 跳过了 postinstall）
      - run: npm run sync-version
      - run: npm run lint
      - run: npm run test
      - run: npm run tauri:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MdReader-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          # beta/rc 标签自动标记为预发布，避免出现在 Latest
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
