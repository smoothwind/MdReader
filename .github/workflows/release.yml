name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: node scripts/copy-vditor.mjs
      # 版本号单一来源：以 package.json 为准同步 tauri.conf.json 与 Cargo.toml，
      # 避免只改 package.json 打 tag 导致产物版本漂移（npm ci 跳过了 postinstall）
      - run: npm run sync-version
      - run: npm run lint
      - run: npm run test
      - run: npm run tauri:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MdReader-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
      # 同一 tag 下若残留重复的 draft release，softprops 收尾时会因 tag_name 冲突
      # 报 Validation Failed（曾在重打 tag 后出现）。发布前先清理该 tag 的草稿版本。
      - name: Prune duplicate draft releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          for id in $ids; do
            echo "delete draft release $id (tag $GITHUB_REF_NAME)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          # beta/rc 标签自动标记为预发布，避免出现在 Latest
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
